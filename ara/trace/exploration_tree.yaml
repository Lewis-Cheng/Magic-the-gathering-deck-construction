tree:
  - id: N01
    type: question
    support_level: explicit
    source_refs: ["CONTEXT.md What the project is", "REPORT.md §1"]
    title: "Can an Ovika UR convoke list be iterated under a disclosed 4-player CR engine?"
    provenance: user
    timestamp: "2026-09-03T00:00"
    description: >
      Build a legal 100-card Ovika deck and measure it with Oracle-backed
      definitions, a CR-structured engine, fixed EDHREC opponents, and
      GPU opener statistics — without calling heuristic shares a real
      Magic win rate.
    children:
      - id: N02
        type: experiment
        support_level: explicit
        source_refs: ["CONTEXT.md v11 storm baseline"]
        title: "v11 storm archive on old engine"
        provenance: user
        timestamp: "2026-09-03T00:00"
        result: >
          9/36 (25%) pod share. CONTEXT.md labels these old-engine numbers;
          not a same-stamp A/B for later lists.
        evidence: [C04, "REPORT.md Table in §1 v11 column"]
        children:
          - id: N03
            type: decision
            support_level: explicit
            source_refs: ["CONTEXT.md v12.0", "REPORT.md §4 convoke engine"]
            title: "Pivot construction from storm to Ovika goblin-convoke"
            provenance: user
            timestamp: "2026-09-03T00:00"
            choice: >
              Tokens from Ovika's noncreature trigger convoke-pay the next
              spell and chain into amplifiers (City on Fire / Inferno / Torbran).
            alternatives:
              - "Keep iterating the v11 storm list on the new engine"
            evidence: >
              REPORT.md §4 strategy paragraph; CONTEXT deck history.
            children:
              - id: N04
                type: dead_end
                support_level: explicit
                source_refs: ["CONTEXT.md v12.0"]
                title: "v12.0 first convoke cut"
                provenance: user
                timestamp: "2026-09-03T00:00"
                hypothesis: >
                  Convoke bodies alone would convert tokens into a clock
                  on the locked T14 pod.
                failure_mode: >
                  3/36 (8%) — CONTEXT: no burst.
                lesson: >
                  Need rituals / Mana Echoes / cantrips (velocity + burst),
                  not only slow convoke creatures.

              - id: N05
                type: experiment
                support_level: explicit
                source_refs: ["REPORT.md §1 v12.1 column", "results_pod_v12.csv"]
                title: "v12.1 confirmation pod"
                also_depends_on: [N04]
                provenance: user
                timestamp: "2026-09-03T00:00"
                result: >
                  Ovika 9/36 (25%), Nekusar 6/36 (17%), Kuja 7/36 (19%),
                  Minstrel 3/36 (8%), 11 no-winner (31%); list $533.00.
                  GPU 200k: keep 82.1%, P(2-5)=0.640, screw 0.359, T5 lands 3.39.
                evidence: [C01, C03, "evidence/tables/table1_result_summary.md"]
                children:
                  - id: N06
                    type: decision
                    support_level: explicit
                    source_refs: ["REPORT.md §1 adopted build paragraph"]
                    title: "Adopt v12.1 as live deck"
                    provenance: user
                    timestamp: "2026-09-03T00:00"
                    choice: >
                      Keep deck_v12.py as FINAL; paste-ready list in decklist_v12.md.
                    alternatives:
                      - "Continue storm v11 as live"
                      - "Ship v12.0"
                    evidence: >
                      Matches archived v11 numerator with better openers and
                      $533 under $1000; still heuristic baseline (C04).
                    children:
                      - id: N07
                        type: experiment
                        support_level: explicit
                        source_refs: ["CONTEXT.md graph_analysis.py"]
                        title: "Synergy-graph audit of v12.1"
                        provenance: ai-executed
                        timestamp: "2026-09-03T00:00"
                        result: >
                          72 nodes, 712 tight edges, 1 component, 3 communities;
                          no node degree < 3; deg-3 tail = 7 draw/velocity spells.
                        evidence: [C05, "evidence/tables/table2_graph_audit.md"]
                        children:
                          - id: N08
                            type: dead_end
                            support_level: explicit
                            source_refs: ["CONTEXT.md v12.2", "results_deck_v12_2.csv"]
                            title: "v12.2 pinger/connectivity swap rejected"
                            provenance: user
                            timestamp: "2026-09-03T00:00"
                            hypothesis: >
                              Guttersnipe + Coruscation Mage + Seething Song,
                              cutting three 6-8 MV convoke creatures, would
                              raise ping density and pod wins.
                            failure_mode: >
                              8/36 (22%) at $546.04 — no improvement vs 9/36.
                            lesson: >
                              Trust the locked pod over the graph; velocity
                              cards that look like outliers can be load-bearing.
                              Also exposed priority no-op hangs (N09).

      - id: N09
        type: decision
        support_level: explicit
        source_refs: ["REPORT.md §3 items 1-2", "CONTEXT.md Engine reliability"]
        title: "Unify damage routing and treat no-ops as passes"
        provenance: user
        timestamp: "2026-09-03T00:00"
        choice: >
          All damage through Game.deal_damage (CR 614 amps); priority_loop
          counts unchanged state as a CR 117 pass after 8-min hangs on a
          68-permanent board.
        alternatives:
          - "Leave extra life-subtraction paths"
          - "Watchdog hung games with daemon threads"
        evidence: >
          REPORT.md Reliability; CONTEXT forbids daemon watchdogs (GIL).
        children:
          - id: N10
            type: experiment
            support_level: explicit
            source_refs: ["engine README Verified behavior", "CONTEXT.md verify_phases.py"]
            title: "verify_phases.py 21/21"
            provenance: ai-executed
            timestamp: "2026-09-03T00:00"
            result: >
              21/21 PASS after engine changes (phase order, stack, tax, SBA,
              London mulligan, cleanup). Does not imply full-card coverage.
            evidence: [C04, "evidence/tables/table3_verifier_checks.md"]

  - id: N11
    type: pivot
    support_level: explicit
    source_refs: ["ISSUES-poor-deck-performance.md A1-A7"]
    title: "Lab metrics are not a flexible Commander generator"
    provenance: user
    timestamp: "2026-09-13T00:00"
    from: "Iterate one Ovika list with pod_v12.py retain-on-wins"
    to: "Separate product generation (theme retrieval, slot recipes) from lab confirmation"
    trigger: >
      Product target wants any commander/theme/price; retain-on-Nekusar-pod
      rejects on-theme cards and v12.2 already showed graph-only harm.

  - id: N12
    type: decision
    support_level: inferred
    source_refs: []
    title: "Compile lab notes into an ARA so agents stop re-deriving retain rules"
    provenance: ai-suggested
    timestamp: "2026-09-15T18:49"
    choice: >
      Structured claims C01-C06 bound to CSVs and REPORT.md.
    alternatives:
      - "Leave knowledge only in CONTEXT.md prose"
    evidence: >
      Reconstruction of why this plugin pass exists; not a 2026-09-03 session log.
